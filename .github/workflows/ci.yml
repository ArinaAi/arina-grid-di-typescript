# CI: lint hand-written code, typecheck, run the offline test suite, build both module formats, pack.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]  # supported floor (engines) and current LTS
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (ESM + CJS)
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Import from the packed tarball (ESM, CJS, lib subpath)
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz
          node --input-type=module -e "import C from '$name'; import { waitForExtractRun } from '$name/lib'; console.log(typeof C, typeof waitForExtractRun)"
          node -e "const { ArinaDocumentIntelligenceAPI } = require('$name'); require('$name/lib'); console.log(typeof ArinaDocumentIntelligenceAPI)"

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
